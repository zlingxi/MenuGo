<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MenuGo</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="./main.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <img src="assets/logo.png" alt="" draggable="false" />
          </span>
          <span class="brand-copy">
            <span class="brand-name">MenuGo</span>
            <span class="brand-sub" data-i18n="tagline">Windows 11 右键菜单</span>
          </span>
        </div>

        <div class="topbar-actions">
          <button id="btn-language" class="ghost-btn" aria-haspopup="listbox" aria-expanded="false">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18" />
            </svg>
            <span id="language-label">Auto</span>
            <svg class="ico caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          <button id="btn-theme" class="icon-btn" data-i18n-aria="ariaTheme">
            <svg class="ico theme-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="ico theme-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
            </svg>
          </button>
          <button id="btn-settings" class="icon-btn" aria-haspopup="dialog" aria-expanded="false" data-i18n-aria="quickSettings">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h9M18 7h2M4 17h2M11 17h9" />
              <circle cx="15.5" cy="7" r="2" />
              <circle cx="8.5" cy="17" r="2" />
            </svg>
          </button>
          <button id="btn-more" class="icon-btn" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="moreMenu">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="5.2" r="1.7" fill="currentColor" stroke="none" />
              <circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none" />
              <circle cx="12" cy="18.8" r="1.7" fill="currentColor" stroke="none" />
            </svg>
          </button>
        </div>

        <div id="language-menu" class="language-menu hidden" role="listbox" data-i18n-aria="languageLabel"></div>

        <div id="more-menu" class="more-menu hidden" role="menu" data-i18n-aria="moreMenu">
          <button type="button" class="menu-item" role="menuitem" data-link="cmdinfo">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M7 9l3 3-3 3M12.5 15H17" /></svg>
            <span data-i18n="cmdInfo">命令行帮助</span>
          </button>
          <button type="button" class="menu-item" role="menuitem" data-link="about">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" /></svg>
            <span data-i18n="about">关于</span>
          </button>
          <div class="menu-sep" role="separator"></div>
          <button type="button" class="menu-item" role="menuitem" data-link="github">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.76.11 3.05.73.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .3.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z" /></svg>
            <span>GitHub</span>
          </button>
          <button type="button" class="menu-item" role="menuitem" data-link="blog">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11a8 8 0 0 1 8 8M5 5a14 14 0 0 1 14 14" /><circle cx="6" cy="18" r="1.4" /></svg>
            <span data-i18n="blog">博客</span>
          </button>
          <button type="button" class="menu-item" role="menuitem" data-link="donate">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-9.2-8.9A5.2 5.2 0 0 1 12 6.6a5.2 5.2 0 0 1 9.2 4.5C19 15.5 12 20 12 20z" /></svg>
            <span data-i18n="donate">捐赠</span>
          </button>
        </div>
      </header>

      <main class="content">
        <div id="os-warning" class="banner banner-warn hidden">
          <span class="banner-copy"><strong id="os-warning-text"></strong></span>
        </div>

        <section class="hero" aria-labelledby="style-title">
          <div class="hero-top">
            <div class="hero-copy">
              <div class="style-line">
                <span class="eyebrow" data-i18n="currentStyle">当前样式</span>
                <span class="line-sep" aria-hidden="true">&middot;</span>
                <h1 id="style-title">&mdash;</h1>
              </div>
              <p id="style-desc"></p>
            </div>
            <div class="hero-art" aria-hidden="true">
              <div class="mini-menu">
                <span class="mini-line wide"></span>
                <span class="mini-line"></span>
                <span class="mini-line mid"></span>
                <span class="mini-line wide"></span>
              </div>
            </div>
          </div>

          <div class="segmented" role="radiogroup" data-i18n-aria="ariaSwitch">
            <button id="seg-classic" class="seg" role="radio" aria-checked="false">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5h16v4H4zM4 11h16v4H4zM4 17h10" />
              </svg>
              <span data-i18n="classicMenu">经典菜单</span>
            </button>
            <button id="seg-default" class="seg" role="radio" aria-checked="true">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="5" width="16" height="14" rx="2" />
                <path d="M7 9h10M7 13h6" />
              </svg>
              <span data-i18n="defaultMenu">默认菜单</span>
            </button>
          </div>
        </section>

        <div id="restart-banner" class="banner banner-pending hidden">
          <span class="banner-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M13 2L5 13h6l-1 9 8-11h-6z" /></svg>
          </span>
          <span class="banner-copy">
            <strong data-i18n="restartTitle">更改已写入</strong>
            <span data-i18n="restartDesc">重启资源管理器后生效</span>
          </span>
          <button id="btn-restart-now" class="primary-btn" data-i18n="restartNow">立即重启</button>
        </div>

      </main>

      <footer class="statusline">
        <span id="os-label">Windows</span>
        <span id="elevated-sep" class="sep hidden">&middot;</span>
        <span id="elevated-label" class="hidden" data-i18n="admin">管理员</span>
        <span class="grow"></span>
        <span id="version-label">v0.1.0</span>
      </footer>
    </div>

    <div id="settings-scrim" class="scrim hidden"></div>

    <aside id="settings-panel" class="settings-panel hidden" role="dialog" data-i18n-aria="quickSettings">
      <div class="panel-head">
        <h2 data-i18n="quickSettings">快捷设置</h2>
        <button id="btn-close-settings" class="icon-btn small" data-i18n-aria="ariaClose">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>

      <div class="panel-body">
        <label class="setting-row" for="sw-apply-all" id="row-apply-all">
          <span class="setting-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3" /><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5M17 8h4M19 6v4" /></svg>
          </span>
          <span class="setting-copy">
            <span class="setting-title" data-i18n="applyAll">应用到所有用户</span>
            <span class="setting-desc" id="hint-apply-all"></span>
          </span>
          <input id="sw-apply-all" type="checkbox" class="switch-input" />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <label class="setting-row" for="sw-auto-hide">
          <span class="setting-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 17h16M5 13h14M8 9h8" /></svg>
          </span>
          <span class="setting-copy">
            <span class="setting-title" data-i18n="autoHide">自动隐藏任务栏</span>
            <span class="setting-desc" id="hint-auto-hide"></span>
          </span>
          <input id="sw-auto-hide" type="checkbox" class="switch-input" />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <label class="setting-row" for="sw-auto-restart">
          <span class="setting-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M19 8a8 8 0 1 0 1 6" /><path d="M19 4v4h-4" /></svg>
          </span>
          <span class="setting-copy">
            <span class="setting-title" data-i18n="autoRestart">切换后自动重启 Explorer</span>
            <span class="setting-desc" id="hint-auto-restart"></span>
          </span>
          <input id="sw-auto-restart" type="checkbox" class="switch-input" />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <label class="setting-row" for="sw-taskbar-top" id="row-taskbar-top">
          <span class="setting-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M3 9h18" /></svg>
          </span>
          <span class="setting-copy">
            <span class="setting-title" data-i18n="taskbarTop">任务栏置顶</span>
            <span class="setting-desc" id="hint-taskbar-top"></span>
          </span>
          <input id="sw-taskbar-top" type="checkbox" class="switch-input" />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <div class="theme-block">
          <div class="theme-head">
            <span class="setting-title" data-i18n="theme">外观</span>
            <span class="setting-desc" id="hint-theme"></span>
          </div>
          <div id="theme-options" class="theme-options" role="radiogroup" data-i18n-aria="ariaTheme">
            <button type="button" class="theme-opt" role="radio" data-theme-value="light" aria-checked="true" data-i18n="themeLight">浅色</button>
            <button type="button" class="theme-opt" role="radio" data-theme-value="dark" aria-checked="false" data-i18n="themeDark">深色</button>
            <button type="button" class="theme-opt" role="radio" data-theme-value="system" aria-checked="false" data-i18n="themeSystem">跟随系统</button>
          </div>
        </div>

        <div class="setting-row static">
          <span class="setting-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M10 11v6M14 11v6" /></svg>
          </span>
          <span class="setting-copy">
            <span class="setting-title" data-i18n="clearCache">清除缓存</span>
            <span class="setting-desc" data-i18n="clearCacheDesc">删除本软件保存在用户目录的设置与缓存文件</span>
          </span>
          <button type="button" id="btn-clear-cache" class="danger-btn" data-i18n="clearCacheAction">清除</button>
        </div>
      </div>

      <div class="panel-foot">
        <span class="panel-hint" data-i18n="panelHint">设置会立即保存</span>
        <button id="btn-panel-refresh" class="ghost-btn small" data-i18n="refresh">刷新</button>
      </div>
    </aside>

    <div id="modal-backdrop" class="modal-backdrop hidden">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h2 id="dialog-title"></h2>
        <div id="dialog-body" class="dialog-body"></div>
        <div class="dialog-actions">
          <button id="dialog-cancel" class="ghost-btn hidden" data-i18n="cancel">取消</button>
          <button id="dialog-ok" class="primary-btn" data-i18n="ok">确定</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
  </body>
</html>
